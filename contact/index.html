<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Chef Liz Murphy | Santosha Nutrition</title>
<meta name="description" content="Ask about cooking classes, catering, farm-to-table experiences, menu consulting or the cookbook, and find answers to common questions.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact Chef Liz Murphy | Santosha Nutrition">
<meta property="og:description" content="Ask about cooking classes, catering, farm-to-table experiences, menu consulting or the cookbook, and find answers to common questions.">
<meta property="og:image" content="https://trevorprovencio-bit.github.io/santosha-site/assets/img/liz-market-friends.jpg">
<meta property="og:url" content="https://trevorprovencio-bit.github.io/santosha-site/contact/">
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
body{margin:0;background:var(--surface)}

</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This design preview needs JavaScript turned on.</p></noscript>
<template id="tpl">
<div style="background: var(--surface); color: var(--ink); font-family: var(--font-text); min-width: 0;">

<x-import component-from-global-scope="Santosha.SiteHeader" home-href="../" logo-src="../assets/img/santosha-lockup.png" logo-alt="Santosha plant-based nutrition" links="{{navLinks}}" cta="{{headerCta}}"></x-import>

<section id="contact" aria-labelledby="contact-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 72px;">
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Contact Chef Liz</p>
<h1 id="contact-title" class="display" style="margin: 0;">How can I help you find your santosha?</h1>
<p class="lead" style="margin: 0; max-width: 34em; color: var(--ink-muted);">Tell me a little about what you’re planning, and I’ll be in touch soon.</p>
<dl style="margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line);">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><dt class="label">Home base</dt><dd class="body-sm" style="margin: 0; color: var(--ink-muted);">Vista, California</dd></div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><dt class="label">Serving</dt><dd class="body-sm" style="margin: 0; color: var(--ink-muted);">North County San Diego, and online</dd></div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; padding: 4px 0; border-bottom: 1px solid var(--line);"><dt class="label">Follow along</dt><dd style="margin: 0;"><x-import component-from-global-scope="Santosha.TextLink" href="https://www.instagram.com/santoshanutrition">Instagram</x-import></dd></div>
</dl>
</div>
<div style="flex: 1 1 520px; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-raised); padding: clamp(24px, 4vw, 40px);">
<div hidden="{{formHidden}}">
<form aria-labelledby="form-title" onSubmit="{{sendMessage}}" style="display: flex; flex-direction: column; gap: 24px;">
<h2 id="form-title" class="heading-1" style="margin: 0;">Send Liz a message</h2>
<x-import component-from-global-scope="Santosha.TextField" id="name" label="Name" auto-complete="name"></x-import>
<x-import component-from-global-scope="Santosha.TextField" id="email" label="Email address" type="email" auto-complete="email"></x-import>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0;">
<legend class="label" style="padding: 0; margin-bottom: 12px;">I’m interested in help with</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px;">
<label for="interest-0" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer;"><input id="interest-0" type="checkbox" name="interest" value="Cooking classes" style="width: 20px; height: 20px; margin: 0; accent-color: var(--forest);"><span class="body-sm">Cooking classes</span></label>
<label for="interest-1" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer;"><input id="interest-1" type="checkbox" name="interest" value="Catering &amp; events" style="width: 20px; height: 20px; margin: 0; accent-color: var(--forest);"><span class="body-sm">Catering &amp; events</span></label>
<label for="interest-2" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer;"><input id="interest-2" type="checkbox" name="interest" value="Farm-to-table experience" style="width: 20px; height: 20px; margin: 0; accent-color: var(--forest);"><span class="body-sm">Farm-to-table experience</span></label>
<label for="interest-3" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer;"><input id="interest-3" type="checkbox" name="interest" value="Menu consulting" style="width: 20px; height: 20px; margin: 0; accent-color: var(--forest);"><span class="body-sm">Menu consulting</span></label>
<label for="interest-4" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer;"><input id="interest-4" type="checkbox" name="interest" value="Kitchen Contentment cookbook" style="width: 20px; height: 20px; margin: 0; accent-color: var(--forest);"><span class="body-sm">Kitchen Contentment cookbook</span></label>
<label for="interest-5" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer;"><input id="interest-5" type="checkbox" name="interest" value="Something else" style="width: 20px; height: 20px; margin: 0; accent-color: var(--forest);"><span class="body-sm">Something else</span></label>
</div>
</fieldset>
<x-import component-from-global-scope="Santosha.TextField" id="message" label="Your message" optional="{{yes}}" multiline="{{yes}}" rows="5" hint="Dates, number of guests, allergies, anything that helps."></x-import>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px;">
<x-import component-from-global-scope="Santosha.Button" type="submit">Send message</x-import>
<x-import component-from-global-scope="Santosha.TextLink" href="#disclaimer">Medical disclaimer</x-import>
</div>
</form>
</div>
<div hidden="{{doneHidden}}" role="status">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 24px 0;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Message sent</p>
<p class="heading-1" style="margin: 0;">Thank you! Liz will be in touch with you soon.</p>
</div>
</div>
</div>
</section>

<section id="faq" aria-labelledby="faq-title" style="background: var(--surface-sunk);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 72px;">
<div style="flex: 1 1 340px; min-width: 0; max-width: 420px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">FAQ</p>
<h2 id="faq-title" class="display" style="margin: 0;">Questions, answered.</h2>
<p class="body" style="margin: 0; max-width: var(--text-max); color: var(--ink-muted);">Have another question? Send it with the form above.</p>
</div>
<img src="../assets/img/liz-market-friends.jpg" alt="Liz laughing with two vendors over carrots at the farmers market" style="display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover;">
</div>
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column;">
<x-import component-from-global-scope="Santosha.FaqItem" question="Do I have to become a vegan?" default-open="{{yes}}"><p>Of course not! Your diet is your choice. I’m here to give you information and guide you on your own journey. I don’t expect everyone I work with to cut out all animal products, but my goal is to help you find the food choices that are best for you and for the planet, and to live by three words: eat more plants.</p></x-import>
<x-import component-from-global-scope="Santosha.FaqItem" question="Why should I eat more plants?"><p>Most people come to plants for one of three reasons: their own health, care for the environment or love of animals. Eating more plants is one of the best things you can do for your health, today and in the future, and eating fewer animal products is better for the planet too.</p></x-import>
<x-import component-from-global-scope="Santosha.FaqItem" question="How do I even start?"><p>Deciding to eat more fruits and vegetables can feel hard, especially when you don’t know where to begin. That’s why I’m here, with guidance, cooking classes and resources to help you start.</p></x-import>
<x-import component-from-global-scope="Santosha.FaqItem" question="How much does a cooking class cost?"><p>In-person classes are $100/guest ($125 minimum) and include the ingredients, equipment, three dishes and digital recipes. Virtual classes are $150/class for you and up to 10 friends. Interactive dinners are $110/guest for groups of 5–15.</p></x-import>
<x-import component-from-global-scope="Santosha.FaqItem" question="How many guests can you cater for?"><p>Santosha caters events for 10 to 1,000 guests, with plated, buffet or food vending service. Every event is different, so send the details and Liz will get back to you with pricing.</p></x-import>
<x-import component-from-global-scope="Santosha.FaqItem" question="Can I give a class as a gift?"><p>Yes. Cooking class gift certificates are $125.00 for one guest and $200.00 for two, and you can buy them in the shop.</p></x-import>
<div id="disclaimer" style="margin-top: 32px; padding: 20px 24px; border-left: 4px solid var(--citrus); background: var(--surface-raised); display: flex; flex-direction: column; gap: 8px;">
<p class="label" style="margin: 0;">Medical disclaimer</p>
<p class="body-sm" style="margin: 0; color: var(--ink-muted);">Liz Murphy is not a doctor or a dietitian. What you read here and learn in her classes is for education only, and doesn’t replace advice from your doctor.</p>
<div><x-import component-from-global-scope="Santosha.TextLink" href="../contact/#disclaimer">Read the full disclaimer</x-import></div>
</div>
</div>
</div>
</section>

<x-import component-from-global-scope="Santosha.SiteFooter" mark-src="../assets/img/santosha-mark-white.svg" tagline="Find your santosha…" location="Home Base — Vista, CA" columns="{{footerColumns}}" legal="© Santosha Nutrition. Plant-based nutrition education, not medical advice."></x-import>

</div>
</template>
<script src="../assets/js/react.production.min.js"></script>
<script src="../assets/js/react-dom.production.min.js"></script>
<script src="../assets/js/santosha.js"></script>
<script src="../assets/js/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  sendMessage(e) {
    if (e && e.preventDefault) e.preventDefault();
    this.setState({ sent: true });
  }
  renderVals() {
    return {
      yes: true,
      navLinks: [
        { label: 'Cooking classes', href: '../cooking-classes/' },
        { label: 'Catering', href: '../catering/' },
        { label: 'Events', href: '../events/' },
        { label: 'Cookbook', href: '../cookbook/' },
        { label: 'About Liz', href: '../about/' },
        { label: 'Contact', href: '../contact/', current: true }
      ],
      headerCta: { label: 'Book a class', shortLabel: 'Book', href: '../cooking-classes/' },
      sendMessage: (e) => this.sendMessage(e),
      formHidden: !!(this.state && this.state.sent),
      doneHidden: !(this.state && this.state.sent),
      footerColumns: [
        { title: 'Work with Liz', links: [{ label: 'Cooking classes', href: '../cooking-classes/' }, { label: 'Catering & events', href: '../catering/' }, { label: 'Farm-to-table experiences', href: '../catering/#farm-to-table' }, { label: 'Menu consulting', href: '../catering/#consulting' }] },
        { title: 'Shop', links: [{ label: 'Kitchen Contentment cookbook', href: '../cookbook/' }, { label: 'Class gift certificates', href: '../cookbook/#gift' }] },
        { title: 'Connect', links: [{ label: 'Contact Chef Liz', href: '../contact/' }, { label: 'Newsletter sign up', href: '../index.html#newsletter' }, { label: 'Media & podcasts', href: '../about/#media' }, { label: 'Instagram', href: 'https://www.instagram.com/santoshanutrition' }] },
        { title: 'Good to know', links: [{ label: 'FAQ', href: '../contact/#faq' }, { label: 'Testimonials', href: '../about/#testimonials' }, { label: 'Medical disclaimer', href: '../contact/#disclaimer' }] }
      ]
    };
  }
}
mountDC(Component);
</script>
</body>
</html>
