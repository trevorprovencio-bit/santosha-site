<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Dinners, Workshops & Food Fest | Santosha</title>
<meta name="description" content="Seasonal farm-to-table dinners, hands-on workshops and the Santosha Food Fest in North County San Diego. Sign up to hear about new dates first.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Farm Dinners, Workshops & Food Fest | Santosha">
<meta property="og:description" content="Seasonal farm-to-table dinners, hands-on workshops and the Santosha Food Fest in North County San Diego. Sign up to hear about new dates first.">
<meta property="og:image" content="https://trevorprovencio-bit.github.io/santosha-site/assets/img/dinner-at-dusk.jpg">
<meta property="og:url" content="https://trevorprovencio-bit.github.io/santosha-site/events/">
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
body{margin:0;background:var(--surface)}

</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This design preview needs JavaScript turned on.</p></noscript>
<template id="tpl">
<div style="background: var(--surface); color: var(--ink); font-family: var(--font-text); min-width: 0;">

<x-import component-from-global-scope="Santosha.SiteHeader" home-href="../" logo-src="../assets/img/santosha-lockup.png" logo-alt="Santosha plant-based nutrition" links="{{navLinks}}" cta="{{headerCta}}"></x-import>

<section class="sn-onband" aria-labelledby="hero-title" style="background: var(--band-forest); color: var(--on-band);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: 72px 24px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 40px 64px;">
<div style="flex: 1 1 520px; min-width: 0; align-self: center; display: flex; flex-direction: column; gap: 24px; padding-bottom: 24px;">
<p class="eyebrow" style="margin: 0;"><span style="border-bottom: 3px solid var(--citrus); padding-bottom: 4px;">Events</span></p>
<h1 id="hero-title" class="display" style="margin: 0;">Farm dinners, workshops and <em>Food Fest</em>.</h1>
<p class="lead" style="margin: 0; max-width: 32em;">Seasonal dinners under the trees, hands-on workshops and the Santosha Food Fest, across North County San Diego.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 8px;">
<x-import component-from-global-scope="Santosha.Button" variant="on-band" size="lg" href="#newsletter">Get new dates by email</x-import>
<x-import component-from-global-scope="Santosha.TextLink" tone="on-band" href="#host">Host a dinner of your own</x-import>
</div>
</div>
<div style="flex: 1 1 460px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: -96px;">
<img src="../assets/img/dinner-at-dusk.jpg" alt="Guests at a long dinner table under the trees at golden hour" style="grid-column: 1 / -1; display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; object-position: 50% 50%;">
<img src="../assets/img/long-table-dinner.jpg" alt="A long outdoor dinner table set with wildflowers" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
<img src="../assets/img/carrots-and-kale.jpg" alt="Purple carrots and kale at the farmers market" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
</div>
</div>
</section>
<div aria-hidden="true" style="height: 96px; background: var(--surface);"></div>

<section id="upcoming" aria-labelledby="upcoming-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--aubergine);">Upcoming</p>
<h2 id="upcoming-title" class="display" style="margin: 0;">Nothing on the calendar right now.</h2>
<p class="body" style="margin: 0; max-width: var(--text-max); color: var(--ink-muted);">New dinners and workshops go to newsletter subscribers first, with pre-sale tickets. Sign up and you’ll hear about the next one before anyone else.</p>
</div>
<div id="newsletter" style="max-width: 880px;">
<x-import component-from-global-scope="Santosha.NewsletterSignup" title="Be first to hear about new dates" description="Event pre-sales, news and plant-based tips, straight from Liz’s kitchen."></x-import>
</div>
</section>

<section id="past" aria-labelledby="past-title" style="background: var(--surface-sunk);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--aubergine);">Past events</p>
<h2 id="past-title" class="display" style="margin: 0;">Recent gatherings.</h2>
</div>
<div>
<div style="display: flex; flex-wrap: wrap; gap: 16px 48px; padding: 32px 0; border-top: 1px solid var(--line);">
<h3 class="heading-1" style="flex: 0 0 120px; margin: 0; color: var(--ink-muted);">2026</h3>
<div style="flex: 1 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
<x-import component-from-global-scope="Santosha.EventCard" month="Apr" day="18" weekday="Sat" title="Pickling Workshop" time="4:30–5:30pm" venue="Bodega Market, Oceanside" status="past" tags="{{workshopTags}}"></x-import>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px 48px; padding: 32px 0; border-top: 1px solid var(--line);">
<h3 class="heading-1" style="flex: 0 0 120px; margin: 0; color: var(--ink-muted);">2025</h3>
<div style="flex: 1 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
<x-import component-from-global-scope="Santosha.EventCard" month="Sep" day="23" weekday="Tue" title="The Plant-Based Replenisher" time="7–8:30pm" venue="Flow to Heal women’s workshop series" status="past" tags="{{workshopTags}}"></x-import>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px 48px; padding: 32px 0; border-top: 1px solid var(--line);">
<h3 class="heading-1" style="flex: 0 0 120px; margin: 0; color: var(--ink-muted);">2024</h3>
<div style="flex: 1 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
<x-import component-from-global-scope="Santosha.EventCard" month="Feb" day="24" weekday="Sat" title="Seasonal Eating for Nourishment" time="12–2pm" venue="Affirmations of Wellness, Oceanside" status="past" tags="{{workshopTags}}"></x-import>
<x-import component-from-global-scope="Santosha.EventCard" month="Feb" day="10" weekday="Sat" title="Winter Farm to Table Dinner" time="4–7pm" venue="Cactus Blossom Retreat, Escondido" status="past" tags="{{dinnerTags}}"></x-import>
<x-import component-from-global-scope="Santosha.EventCard" month="Jan" day="21" weekday="Sun" title="Pickling Workshop" time="12–1:30pm" venue="Sunshine Market and Refillery" status="past" tags="{{workshopTags}}"></x-import>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px 48px; padding: 32px 0; border-top: 1px solid var(--line);">
<h3 class="heading-1" style="flex: 0 0 120px; margin: 0; color: var(--ink-muted);">2023</h3>
<div style="flex: 1 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
<x-import component-from-global-scope="Santosha.EventCard" month="Dec" day="1" weekday="Fri" title="Winter Dinner at The Miller’s Table" time="7–9pm" venue="The Miller’s Table, Oceanside" status="past" tags="{{dinnerTags}}"></x-import>
<x-import component-from-global-scope="Santosha.EventCard" month="Oct" day="21" weekday="Sat" title="Autumn Farm to Table Dinner" time="4–7pm" venue="Equinox Farms" status="past" tags="{{dinnerTags}}"></x-import>
<x-import component-from-global-scope="Santosha.EventCard" month="Aug" day="27" weekday="Sun" title="Santosha Food Fest 2023" time="1–5pm" venue="Helia Brewing Co." status="past" tags="{{festTags}}"></x-import>
</div>
</div>
</div>
</div>
</section>

<section id="food-fest" aria-labelledby="fest-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-direction: column; gap: 40px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 48px;">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Santosha presents</p>
<h2 id="fest-title" class="display" style="margin: 0;">Santosha Food Fest</h2>
</div>
<p class="body" style="flex: 1 1 380px; min-width: 0; margin: 0; max-width: 520px; color: var(--ink-muted);">Plant-based bites and tastings by local chefs, sustainable vendors and live music at Helia Brewing Co. A portion of the proceeds went to the nonprofit Sustainability is Sexy.</p>
</div>
<div class="sn-card-row" style="--sn-card-min: 260px;">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;"><img src="../assets/img/food-fest-2023.png" alt="Food Fest 2023 poster: Sunday 8/27/23 at Helia Brewing Co., 1 to 5pm" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;"><figcaption class="caption" style="color: var(--ink-muted);">2023 · Sunday, August 27</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;"><img src="../assets/img/food-fest-2022.png" alt="Food Fest 2022 poster: Sunday 8/28/22 at Helia Brewing Co., 1 to 5pm" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;"><figcaption class="caption" style="color: var(--ink-muted);">2022 · Sunday, August 28</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;"><img src="../assets/img/food-fest-2021.png" alt="Food Fest 2021 poster: Saturday 8/28/21 at Helia Brewing Co., 5 to 9pm" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;"><figcaption class="caption" style="color: var(--ink-muted);">2021 · Saturday, August 28</figcaption></figure>
</div>
</section>

<div id="host">
<x-import component-from-global-scope="Santosha.Band" tone="forest" eyebrow="Private events" title="Host a dinner of your own.">
<p>Between public events, Liz brings the farm-to-table experience to your group: a market tour, a hands-on class or a private dinner.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 32px;">
<x-import component-from-global-scope="Santosha.Button" variant="on-band" href="../catering/#farm-to-table">Plan a private dinner</x-import>
<x-import component-from-global-scope="Santosha.TextLink" tone="on-band" href="../catering/">See catering</x-import>
</div>
</x-import>
</div>

<x-import component-from-global-scope="Santosha.SiteFooter" mark-src="../assets/img/santosha-mark-white.svg" tagline="Find your santosha…" location="Home Base — Vista, CA" columns="{{footerColumns}}" legal="© Santosha Nutrition. Plant-based nutrition education, not medical advice."></x-import>

</div>
</template>
<script src="../assets/js/react.production.min.js"></script>
<script src="../assets/js/react-dom.production.min.js"></script>
<script src="../assets/js/santosha.js"></script>
<script src="../assets/js/square-links.js"></script>
<script src="../assets/js/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      navLinks: [
        { label: 'Cooking classes', href: '../cooking-classes/' },
        { label: 'Catering', href: '../catering/' },
        { label: 'Events', href: '../events/', current: true },
        { label: 'Cookbook', href: '../cookbook/' },
        { label: 'About Liz', href: '../about/' },
        { label: 'Contact', href: '../contact/' }
      ],
      headerCta: { label: 'Book a class', shortLabel: 'Book', href: '../cooking-classes/' },
      workshopTags: [{ label: 'Workshop', tone: 'aubergine' }],
      dinnerTags: [{ label: 'Dinner', tone: 'aubergine' }],
      festTags: [{ label: 'Food Fest', tone: 'sprout' }],
      footerColumns: [
        { title: 'Work with Liz', links: [{ label: 'Cooking classes', href: '../cooking-classes/' }, { label: 'Catering & events', href: '../catering/' }, { label: 'Farm-to-table experiences', href: '../catering/#farm-to-table' }, { label: 'Menu consulting', href: '../catering/#consulting' }] },
        { title: 'Shop', links: [{ label: 'Kitchen Contentment cookbook', href: '../cookbook/' }, { label: 'Class gift certificates', href: '../cookbook/#gift' }] },
        { title: 'Connect', links: [{ label: 'Contact Chef Liz', href: '../contact/' }, { label: 'Newsletter sign up', href: '#newsletter' }, { label: 'Media & podcasts', href: '../about/#media' }, { label: 'Instagram', href: 'https://www.instagram.com/santoshanutrition' }] },
        { title: 'Good to know', links: [{ label: 'FAQ', href: '../contact/#faq' }, { label: 'Testimonials', href: '../about/#testimonials' }, { label: 'Medical disclaimer', href: '../contact/#disclaimer' }] }
      ]
    };
  }
}
mountDC(Component);
</script>
</body>
</html>
