<p class="lead" style="margin: 0; max-width: 32em;">Chef Liz brings the class to you, in your kitchen or on camera. You’ll learn new plant-based foods and flavors to use in your own life.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 8px;">
<x-import component-from-global-scope="Santosha.Button" variant="on-band" size="lg" href="#book">Book a class</x-import>
<x-import component-from-global-scope="Santosha.TextLink" tone="on-band" href="#gift">Give a class as a gift</x-import>

</div>

<p class="body" style="flex: 1 1 380px; min-width: 0; margin: 0; max-width: 520px; color: var(--ink-muted);">Every class is plant-based and taught by Chef Liz. In person, she brings the ingredients and equipment; on camera, she sends the recipes and a grocery list.</p>
</div>

<x-import component-from-global-scope="Santosha.ServiceCard" title="Virtual class" price="$150/class" note="Up to 10 friends" tags="{{virtualTags}}" image="../assets/img/cooking-demo-yellow-kitchen.jpg" image-alt="Liz and a co-host cooking on camera in a bright yellow kitchen" href="#book" cta-label="Book a class">Let’s cook together on camera. You choose the cuisine, and Liz sends the recipes and ingredient list ahead of time.</x-import>
