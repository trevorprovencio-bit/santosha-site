<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This design preview needs JavaScript turned on.</p></noscript>
<template id="tpl">
<div style="background: var(--surface); color: var(--ink); font-family: var(--font-text); min-width: 0;">

<x-import component-from-global-scope="Santosha.SiteHeader" home-href="../" logo-src="../assets/img/santosha-lockup.png" logo-alt="Santosha plant-based nutrition" links="{{navLinks}}" cta="{{headerCta}}"></x-import>

<section class="sn-onband" aria-labelledby="hero-title" style="background: var(--band-forest); color: var(--on-band);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: 72px 24px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 40px 64px;">
<div style="flex: 1 1 520px; min-width: 0; align-self: center; display: flex; flex-direction: column; gap: 24px; padding-bottom: 24px;">
<p class="eyebrow" style="margin: 0;"><span style="border-bottom: 3px solid var(--citrus); padding-bottom: 4px;">About Liz</span></p>
<h1 id="hero-title" class="display" style="margin: 0;">Eating healthy heals <em>more than your body</em>.</h1>
<p class="lead" style="margin: 0; max-width: 32em;">Liz Murphy is a plant-based educator and vegan chef, and the founder of Santosha Nutrition in Vista, California.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 8px;">
<x-import component-from-global-scope="Santosha.Button" variant="on-band" size="lg" href="../cooking-classes/">Book a class</x-import>
<x-import component-from-global-scope="Santosha.TextLink" tone="on-band" href="../contact/">Contact Liz</x-import>
</div>
</div>
<div style="flex: 1 1 460px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: -96px;">
<img src="../assets/img/liz-portrait.jpg" alt="Liz Murphy smiling in a navy blazer" style="grid-column: 1 / -1; display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; object-position: 50% 18%;">
<img src="../assets/img/liz-with-herbs.jpg" alt="Liz smelling fresh herbs at a farmers market stall" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
<img src="../assets/img/liz-market-friends.jpg" alt="Liz laughing with two vendors over carrots at the farmers market" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
</div>
</div>
</section>
<div aria-hidden="true" style="height: 96px; background: var(--surface);"></div>

<section id="story" aria-labelledby="story-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; gap: 32px 72px;">
<div style="flex: 1 1 360px; min-width: 0; max-width: 440px; display: flex; flex-direction: column; gap: 16px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Her story</p>
<h2 id="story-title" class="display" style="margin: 0;">Food that heals and nourishes.</h2>
</div>
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; max-width: var(--text-max);">
<p class="lead" style="margin: 0;">Liz’s own health struggles started her on a continual journey of experimentation and discovery. Living with food allergies and physical issues, she learned to use food to heal and nourish her body and soul.</p>
<p class="body" style="margin: 0;">She studied hospitality at Northern Arizona University, then spent eight years in restaurants and hotels, building her knowledge of food and nutrition through study, practice and guidance from industry professionals. Travels through Asia, South America and beyond gave her an appreciation for how cultures around the world use food.</p>
<p class="body" style="margin: 0;">Liz earned a Plant-Based Nutrition Certificate from eCornell’s Center for Nutrition Studies, then a Nutrition &amp; Healthy Living Certificate in the same program. In 2021 she founded Sustainability is Sexy, an environmental nonprofit focused on waste diversion and zero-waste education.</p>
<p class="body" style="margin: 0;">Santosha Nutrition grew from a simple idea: eating more plants can change the world.</p>
</div>
</section>

<section aria-label="Liz at work" style="max-width: var(--layout-max); margin: 0 auto; padding: 0 24px;">
<div class="sn-card-row" style="--sn-card-min: 260px;">
<img src="../assets/img/liz-at-the-market.jpg" alt="Liz smiling over produce at a farmers market stall" style="display: block; width: 100%; height: 100%; aspect-ratio: 4 / 5; object-fit: cover;">
<img src="../assets/img/liz-on-the-farm.jpg" alt="Liz picking vegetables in the farm rows with a basket" style="display: block; width: 100%; height: 100%; aspect-ratio: 4 / 5; object-fit: cover;">
<figure style="margin: 0; position: relative;">
<img src="../assets/img/liz-garden-edible-sd.jpg" alt="Liz in the garden holding a bowl of fresh greens" style="display: block; width: 100%; height: 100%; aspect-ratio: 4 / 5; object-fit: cover;">
<figcaption class="caption" style="position: absolute; left: 12px; bottom: 8px; color: var(--on-band); text-shadow: 0 1px 2px #000;">Photo: B. Vance for Edible San Diego</figcaption>
</figure>
</div>
</section>

<section id="credentials" aria-labelledby="cred-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px;">
<div style="flex: 1 1 440px; min-width: 0;">
<x-import component-from-global-scope="Santosha.PullQuote" cite="Liz Murphy" source="Founder, Santosha Nutrition">Eating more plants can change the world.</x-import>
</div>
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
<h2 id="cred-title" class="heading-1" style="margin: 0;">Training and work</h2>

<li style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><span style="display: flex; flex-direction: column;"><span class="label">Nutrition &amp; Healthy Living Certificate</span><span class="caption" style="color: var(--ink-muted);">eCornell, 2019</span></span></li>
<li style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><span style="display: flex; flex-direction: column;"><span class="label">Founder, Sustainability is Sexy</span><span class="caption" style="color: var(--ink-muted);">Zero-waste nonprofit, 2021</span></span><x-import component-from-global-scope="Santosha.TextLink" href="https://www.sustainabilityissexy.org">Visit the nonprofit</x-import></li>
<li style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><span style="display: flex; flex-direction: column;"><span class="label">Sustainable Foodist columnist</span><span class="caption" style="color: var(--ink-muted);">Edible San Diego</span></span><x-import component-from-global-scope="Santosha.TextLink" href="https://www.ediblesandiego.com/contributors/liz-murphy">Read her column</x-import></li>
</ul>
</div>
</section>

<section id="media" aria-labelledby="media-title" style="background: var(--surface-sunk);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-direction: column; gap: 40px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Media &amp; podcasts</p>
<h2 id="media-title" class="display" style="margin: 0;">Liz in the press.</h2>

<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 32px;">

<li style="display: flex; flex-direction: column; gap: 4px; padding: 16px 0; border-top: 1px solid var(--line-strong);">
<span class="eyebrow" style="color: var(--aubergine);">{{m.kind}}</span>
<span class="heading-3">{{m.title}}</span>
<span class="body-sm" style="color: var(--ink-muted);">{{m.outlet}}</span>
<x-import component-from-global-scope="Santosha.TextLink" href="{{m.href}}">{{m.action}}</x-import>
</li>
</sc-for>
</ul>
</div>
</section>

<section id="testimonials" aria-labelledby="happy-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-direction: column; gap: 40px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Happy clients</p>
<h2 id="happy-title" class="display" style="margin: 0;">Even the meat eaters were happy.</h2>
</div>
<div class="sn-card-row" style="--sn-card-min: 300px;">
<x-import component-from-global-scope="Santosha.Testimonial" name="Josh Martyn" featured="{{yes}}">I had no idea plant-based food could be so tasty. I highly recommend Liz!</x-import>
<x-import component-from-global-scope="Santosha.Testimonial" name="Devra G." org="Weekend retreat host">If you want to move into a better way to feed yourself RUN to work with her while she still has time in her schedule, because she is in high demand.</x-import>
<x-import component-from-global-scope="Santosha.Testimonial" name="Kirsten V." org="Galley Solutions">Liz is an incredibly knowledgeable and engaging teacher, and she took such care in working with me to customize the class for Galley’s needs.</x-import>
<x-import component-from-global-scope="Santosha.Testimonial" name="Cassie C.">She is very clean, thorough, and explains cooking methods, nutrition, and where you can buy certain foods.</x-import>
<x-import component-from-global-scope="Santosha.Testimonial" name="Ivette C.">Her cooking was so delicious, that I’m hiring her privately to teach me how to cook!</x-import>
<x-import component-from-global-scope="Santosha.Testimonial" name="Elura M.">We were blessed with her Earth Fairy Vibe and all the love she put in each meal.</x-import>
</div>
</section>

<x-import component-from-global-scope="Santosha.TextLink" tone="on-band" href="../contact/">Contact Liz</x-import>
