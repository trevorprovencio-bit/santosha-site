<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Contentment Cookbook by Chef Liz Murphy | Santosha</title>
<meta name="description" content="Over 50 plant-based, seasonal recipes, tips and techniques from Chef Liz Murphy, plus cooking class gift certificates.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Kitchen Contentment Cookbook by Chef Liz Murphy | Santosha">
<meta property="og:description" content="Over 50 plant-based, seasonal recipes, tips and techniques from Chef Liz Murphy, plus cooking class gift certificates.">
<meta property="og:image" content="https://trevorprovencio-bit.github.io/santosha-site/assets/img/kitchen-contentment-cover.jpg">
<meta property="og:url" content="https://trevorprovencio-bit.github.io/santosha-site/cookbook/">
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
body{margin:0;background:var(--surface)}

</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This design preview needs JavaScript turned on.</p></noscript>
<template id="tpl">
<div style="background: var(--surface); color: var(--ink); font-family: var(--font-text); min-width: 0;">

<x-import component-from-global-scope="Santosha.SiteHeader" home-href="../" logo-src="../assets/img/santosha-lockup.png" logo-alt="Santosha plant-based nutrition" links="{{navLinks}}" cta="{{headerCta}}"></x-import>

<section id="cookbook" aria-labelledby="book-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 72px;">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
<img src="../assets/img/kitchen-contentment-cover.jpg" alt="Kitchen Contentment cookbook on a wood table among peppers, squash and citrus" style="display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover;">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<img src="../assets/img/arugula-peach-salad.jpg" alt="Arugula, peach and pomegranate salad in a yellow bowl" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
<img src="../assets/img/carrots-and-kale.jpg" alt="Purple carrots and kale at the farmers market" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
<img src="../assets/img/pasta-with-lemons.jpg" alt="Pasta with crispy chickpeas, herbs and lemons" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
</div>
</div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">The cookbook</p>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 id="book-title" class="display" style="margin: 0;">Kitchen Contentment</h1>
<p class="tagline" style="margin: 0; color: var(--ink-muted);">a seasonal guide to cooking with plants</p>
</div>
<p class="price" style="margin: 0; font-size: 28px; line-height: 32px;">$40.00</p>
<p class="body" style="margin: 0; max-width: var(--text-max);">Over 50 plant-based, seasonal recipes, tips and techniques from Chef Liz. She wrote it to support local farmers and to help you cook with what’s in season, for a healthy body and a healthy food system.</p>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<span id="qty-label" class="label">Quantity</span>
<div role="group" aria-labelledby="qty-label" style="display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-raised);">
<button type="button" aria-label="One fewer" onClick="{{lessBooks}}" style="width: 48px; height: 48px; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 22px; cursor: pointer; border-radius: var(--radius-pill);">−</button>
<output class="label" aria-live="polite" style="min-width: 32px; text-align: center;">{{qty}}</output>
<button type="button" aria-label="One more" onClick="{{moreBooks}}" style="width: 48px; height: 48px; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 22px; cursor: pointer; border-radius: var(--radius-pill);">+</button>
</div>
</div>
<x-import component-from-global-scope="Santosha.Button" href="../cookbook/">Add to cart</x-import>
</div>
<ul style="list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line);">
<li style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><span class="label">Recipes</span><span class="body-sm" style="color: var(--ink-muted);">Over 50, plant-based and seasonal</span></li>
<li style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><span class="label">Author</span><span class="body-sm" style="color: var(--ink-muted);">Chef Liz Murphy</span></li>
<li style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line);"><span class="label">Printing</span><span class="body-sm" style="color: var(--ink-muted);">Carbon-neutral, with the Forest Stewardship Council</span></li>
</ul>
</div>
</section>

<section aria-labelledby="inside-title" style="background: var(--surface-sunk);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px;">
<div style="flex: 1 1 560px; min-width: 0;">
<img src="../assets/img/kitchen-contentment-spread.jpg" alt="The book open to Hearts of Palm Ceviche and Green Cactus &amp; Jackfruit Stew" style="display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover;">
</div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">A peek inside</p>
<h2 id="inside-title" class="display" style="margin: 0;">Recipes written the way Liz cooks.</h2>
<p class="body" style="margin: 0; max-width: var(--text-max); color: var(--ink-muted);">Every recipe lists its yield and timing up front, with ingredient amounts first and the preparation in italics.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<article style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<h3 class="heading-2" style="margin: 0; color: var(--forest);">Green Cactus &amp; Jackfruit Stew</h3>
<p class="caption" style="margin: 0; color: var(--ink-muted);">Yield: 6 servings // Prep time: 20 min // Cook time: 20 min</p>
</article>
<article style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<h3 class="heading-2" style="margin: 0; color: var(--forest);">Hearts of Palm Ceviche</h3>
<p class="caption" style="margin: 0; color: var(--ink-muted);">Yield: 6 servings // Prep time: 30 min</p>
</article>
</div>
</div>
</div>
</section>

<section id="gift" aria-labelledby="gift-title" style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 48px;">
<div style="flex: 1 1 320px; min-width: 0; max-width: 400px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px;">
<p class="eyebrow" style="margin: 0; color: var(--forest);">Gift certificates</p>
<h2 id="gift-title" class="display" style="margin: 0;">Give a cooking class.</h2>
<p class="body" style="margin: 0; max-width: var(--text-max); color: var(--ink-muted);">A plant-based cooking class with Chef Liz, for one guest or two.</p>
</div>
<div><x-import component-from-global-scope="Santosha.TextLink" href="../cooking-classes/">See how classes work</x-import></div>
</div>
<div class="sn-card-row" style="flex: 2 1 620px; min-width: 0; --sn-card-min: 280px;">
<x-import component-from-global-scope="Santosha.ServiceCard" title="Gift certificate for 1" price="$125.00" note="One guest" image="../assets/img/cooking-demo-yellow-kitchen.jpg" image-alt="Liz and a co-host cooking in a bright yellow kitchen" href="#gift" cta-label="Buy gift certificate">A plant-based cooking class with Chef Liz.</x-import>
<x-import component-from-global-scope="Santosha.ServiceCard" title="Gift certificate for 2" price="$200.00" note="Two guests" image="../assets/img/hands-on-class.jpg" image-alt="A guest chopping vegetables beside Liz during a cooking class" href="#gift" cta-label="Buy gift certificate">A plant-based cooking class with Chef Liz, for two.</x-import>
</div>
</section>

<section id="newsletter" style="background: var(--surface-sunk);">
<div style="max-width: var(--layout-max); margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 40px 48px;">
<div style="flex: 1 1 480px; min-width: 0;">
<x-import component-from-global-scope="Santosha.NewsletterSignup" title="Get Liz’s newsletter" description="Event pre-sales, news and plant-based tips, straight from Liz’s kitchen."></x-import>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<img src="../assets/img/skillet-slice.jpg" alt="A slice lifted from a cast-iron skillet frittata with tomatoes and herbs" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
<img src="../assets/img/hummus-bowl.jpg" alt="Hummus with paprika and herbs, falafel behind" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;">
</div>
</div>
</section>

<x-import component-from-global-scope="Santosha.SiteFooter" mark-src="../assets/img/santosha-mark-white.svg" tagline="Find your santosha…" location="Home Base — Vista, CA" columns="{{footerColumns}}" legal="© Santosha Nutrition. Plant-based nutrition education, not medical advice."></x-import>

</div>
</template>
<script src="../assets/js/react.production.min.js"></script>
<script src="../assets/js/react-dom.production.min.js"></script>
<script src="../assets/js/santosha.js"></script>
<script src="../assets/js/dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      navLinks: [
        { label: 'Cooking classes', href: '../cooking-classes/' },
        { label: 'Catering', href: '../catering/' },
        { label: 'Events', href: '../events/' },
        { label: 'Cookbook', href: '../cookbook/', current: true },
        { label: 'About Liz', href: '../about/' },
        { label: 'Contact', href: '../contact/' }
      ],
      headerCta: { label: 'Book a class', shortLabel: 'Book', href: '../cooking-classes/' },
      qty: (this.state && this.state.qty) || 1,
      lessBooks: () => this.setState({ qty: Math.max(1, ((this.state && this.state.qty) || 1) - 1) }),
      moreBooks: () => this.setState({ qty: ((this.state && this.state.qty) || 1) + 1 }),
      footerColumns: [
        { title: 'Work with Liz', links: [{ label: 'Cooking classes', href: '../cooking-classes/' }, { label: 'Catering & events', href: '../catering/' }, { label: 'Farm-to-table experiences', href: '../catering/#farm-to-table' }, { label: 'Menu consulting', href: '../catering/#consulting' }] },
        { title: 'Shop', links: [{ label: 'Kitchen Contentment cookbook', href: '../cookbook/' }, { label: 'Class gift certificates', href: '../cookbook/#gift' }] },
        { title: 'Connect', links: [{ label: 'Contact Chef Liz', href: '../contact/' }, { label: 'Newsletter sign up', href: '#newsletter' }, { label: 'Media & podcasts', href: '../about/#media' }, { label: 'Instagram', href: 'https://www.instagram.com/santoshanutrition' }] },
        { title: 'Good to know', links: [{ label: 'FAQ', href: '../contact/#faq' }, { label: 'Testimonials', href: '../about/#testimonials' }, { label: 'Medical disclaimer', href: '../contact/#disclaimer' }] }
      ]
    };
  }
}
mountDC(Component);
</script>
</body>
</html>
